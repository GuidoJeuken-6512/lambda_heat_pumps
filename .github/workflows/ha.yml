name: Validate
on:
  push:
    branches:
      - "main"
      # Development branches of the 3.x rewrite (3.5, 3.6, ...).
      - "3.*"
  pull_request:
  schedule:
    - cron: 0 0 * * *
  workflow_dispatch:
jobs:
  hassfest:
    name: with hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: home-assistant/actions/hassfest@master
  hacs:
    name: with hacs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hacs/action@main
        with:
          category: integration