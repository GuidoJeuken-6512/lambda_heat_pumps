name: Create Release Asset

on:
  release:
    types: [published]

jobs:
  build:
    name: Create ZIP Asset
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get release tag
        id: get_tag
        run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create ZIP archive
        run: |
          # HACS (zip_release) extracts the ZIP directly into
          # custom_components/lambda_heat_pumps/, so the files must sit at the ZIP root.
          cd custom_components/lambda_heat_pumps
          zip -r ../../lambda_heat_pumps.zip . -x '*__pycache__*'

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v3
        with:
          files: lambda_heat_pumps.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}




